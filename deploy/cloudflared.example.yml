# Cloudflare Tunnel: gives the gateway an HTTPS address without opening ports on the router.
# Only the API and the phone script go on the internet; the console stays on the office network.
#   cloudflared tunnel login
#   cloudflared tunnel create sms-gateway
#   cloudflared tunnel route dns sms-gateway sms.example.com
#   copy this file to ~/.cloudflared/config.yml, fill in the id and host, then:
#   sudo cloudflared service install          (starts with the Mac)
tunnel: <TUNNEL_ID>
credentials-file: /Users/<you>/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: sms.example.com
    path: ^/(api|phone)/
    service: http://localhost:8094
  - service: http_status:404
