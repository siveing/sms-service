# The gateway and its database. Settings come from the .env file next to this one (see README).
#   docker compose up -d --build        build and start (or update after pulling new code)
#   docker compose up -d db             only the database, for running the app from the IDE
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms_gateway
      POSTGRES_USER: sms_gateway
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sms_gateway}
    # This machine only, for IDE runs; never reachable from the network
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - sms-gateway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_gateway -d sms_gateway"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: sms-gateway:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sms_gateway
      DB_USERNAME: sms_gateway
      DB_PASSWORD: ${DB_PASSWORD:-sms_gateway}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_TOPIC_ID: ${TELEGRAM_TOPIC_ID:-}
      TIME_ZONE: ${TIME_ZONE:-Asia/Phnom_Penh}
    ports:
      - "${PORT:-8094}:8094"

volumes:
  sms-gateway-db:
