name: Container CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # One job only. GitHub bills every job rounded UP to a whole minute, so the previous
  # verify / container / notify split cost three whole-minute minimums per push.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # cache: maven restores ~/.m2 — this is now the ONLY Maven cache that matters,
      # because Maven no longer runs inside the Docker build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Produces target/*.jar, which the Dockerfile copies. Previously this ran here AND
      # again inside the Docker build stage — the same compile twice per push.
      - name: Build and test
        id: verify
        run: mvn -B -ntp clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long

      # No cache-from/cache-to: the image is now a JRE base plus one COPY, so there is
      # nothing expensive left to cache. The old type=gha,mode=max export was ~2.4 GB
      # per push because it carried the whole Maven build stage.
      - name: Build and optionally publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=min
          sbom: true

      # Every push publishes a new sha- tag; without pruning, GHCR storage grows without
      # bound and trips the 500 MB packages quota.
      - name: Prune old image versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false

      - name: Send Telegram notification
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          CONTAINER_RESULT: ${{ steps.publish.outcome }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::warning::Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured"
            exit 0
          fi

          if [[ "$VERIFY_RESULT" == "failure" || "$CONTAINER_RESULT" == "failure" ]]; then
            ICON="❌"
            STATUS="FAILED"
          elif [[ "$VERIFY_RESULT" == "cancelled" || "$CONTAINER_RESULT" == "cancelled" ]]; then
            ICON="⚠️"
            STATUS="CANCELLED"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" && "$VERIFY_RESULT" == "success" && "$CONTAINER_RESULT" == "success" ]]; then
            ICON="✅"
            STATUS="PUBLISHED"
          else
            ICON="⚠️"
            STATUS="VALIDATED — NOT PUBLISHED"
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA}"

          printf -v MESSAGE '%s Container CI %s\n\nRepository: %s\nEvent: %s\nBranch: %s\nCommit: %s\nActor: %s\nVerify: %s\nContainer: %s' \
            "$ICON" "$STATUS" "$GITHUB_REPOSITORY" "${{ github.event_name }}" "${GITHUB_REF_NAME:-unknown}" "$SHORT_SHA" "${{ github.actor }}" "$VERIFY_RESULT" "$CONTAINER_RESULT"

          if [[ "$STATUS" == "PUBLISHED" ]]; then
            MESSAGE+=$'\nImage: '
            MESSAGE+="$IMAGE_REF"
          fi

          MESSAGE+=$'\nRun: '
          MESSAGE+="$RUN_URL"

          if ! curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true" \
            --output /dev/null; then
            echo "::warning::Telegram notification could not be delivered"
          fi
